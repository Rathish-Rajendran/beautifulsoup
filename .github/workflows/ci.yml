name: Build and test
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m pytest -q
      - run: ./build.sh
      - name: Check packaged API outside checkout
        shell: bash
        run: |
          python -m venv /tmp/m2-wheel
          /tmp/m2-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/m2-wheel/bin/python -c 'from bs4 import BeautifulSoup, SoupReplacer; assert str(BeautifulSoup("<b>X</b>", "html.parser", replacer=SoupReplacer("b", "blockquote"))) == "<blockquote>X</blockquote>"'
